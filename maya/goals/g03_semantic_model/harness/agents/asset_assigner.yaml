name: asset_assigner
description: Places each asset of one batch on exactly one page of the semantic model.
instructions: asset_assigner.md
# executor (model via Databricks AI Gateway + workspace auth) and the MAYA tools are injected at run time from maya.yaml
policies:
  tool_budget:
    type: function
    handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
    factory_params: {limit: 8}
